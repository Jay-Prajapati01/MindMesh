name: Build GCP images

# Docker build verification on every PR; pushing to Artifact Registry and
# deploying Cloud Run are manual (workflow_dispatch) and require the GCP
# Workload Identity Federation secrets. No service-account JSON keys.
on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:
    inputs:
      push:
        description: "Push images to Artifact Registry"
        type: boolean
        default: false
      deploy:
        description: "Deploy Cloud Run services/job after push"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  REGISTRY: YOUR-REGION-docker.pkg.dev
  REPOSITORY: YOUR-PROJECT-ID/mindmesh-containers

jobs:
  build:
    name: Build API and worker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.cloud
          push: false
          tags: mindmesh-api:ci

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: false
          tags: mindmesh-worker:ci

  push-deploy:
    name: Push and deploy to Google Cloud
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.push
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build and push images
        run: |
          TAG="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/mindmesh-api:${{ github.sha }}"
          docker build -f backend/Dockerfile.cloud -t "$TAG" backend
          docker push "$TAG"
          TAG="${{ env.REGISTRY }}/${{ env.REPOSITORY }}/mindmesh-worker:${{ github.sha }}"
          docker build -f backend/Dockerfile.worker -t "$TAG" backend
          docker push "$TAG"

      - name: Deploy Cloud Run services and job
        if: inputs.deploy
        run: |
          sed -i "s#:LATEST#:${{ github.sha }}#g" deploy/google-cloud/cloudrun-*.yaml
          gcloud run services replace deploy/google-cloud/cloudrun-api.yaml --region="${{ secrets.GCP_REGION }}"
          gcloud run services replace deploy/google-cloud/cloudrun-dispatcher.yaml --region="${{ secrets.GCP_REGION }}"
          gcloud run jobs replace deploy/google-cloud/cloudrun-worker.yaml --region="${{ secrets.GCP_REGION }}"
