<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        width: 300px;
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #0b0b12;
        color: #f3f4f6;
        padding: 16px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      .url {
        font-size: 11px;
        color: #9ca3af;
        word-break: break-all;
        margin-bottom: 12px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #9ca3af;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        background: #1a1a24;
        border: 1px solid #2a2a38;
        color: #f3f4f6;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        background: #6366f1;
        color: white;
        border: none;
        border-radius: 6px;
        padding: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 16px;
      }
      .ok {
        color: #34d399;
      }
      .err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <h1>Save to MindMesh</h1>
    <div class="url" id="url">Loading...</div>
    <label for="api">Backend URL</label>
    <input id="api" type="text" placeholder="http://localhost:8000" />
    <label for="token">Access token (cloud mode)</label>
    <input id="token" type="password" placeholder="Paste Supabase access token" autocomplete="off" />
    <button id="save">Save page</button>
    <div class="status" id="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
