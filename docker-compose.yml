services:
  backend:
    build: ./backend
    container_name: mindmesh-backend
    env_file:
      - ./backend/.env
    ports:
      # Loopback-only: never expose the (unauthenticated in dev) API to the LAN.
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1g"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./frontend
    container_name: mindmesh-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # Public contact form (Supabase). Publishable key is public by design.
      - NEXT_PUBLIC_SUPABASE_URL=https://anknukysxndknocioxnq.supabase.co
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_BYSG1jw7l_amJ9CL9Et_SQ__Ws2kISa
      # Next's file watcher misses change events on the Docker Desktop bind
      # mount; poll instead so edits are recompiled during development.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mindmesh-qdrant
    ports:
      # Loopback-only: the backend reaches Qdrant as http://qdrant:6333 on the
      # internal network; publishing on 0.0.0.0 would expose the whole
      # knowledge base without authentication.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
  backend_data:
    driver: local
