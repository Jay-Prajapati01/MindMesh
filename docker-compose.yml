services:
  backend:
    build: ./backend
    container_name: mindmesh-backend
    env_file:
      - ./backend/.env
    environment:
      AUTH_ENABLED: "true"
      # Persist the browser outside the container layer. The backend runs as
      # appuser, so this is also the location Playwright must use at runtime.
      PLAYWRIGHT_BROWSERS_PATH: /home/appuser/.cache/ms-playwright
      # Supabase credentials come from backend/.env (single source of truth).
    ports:
      # Loopback-only: never expose the (unauthenticated in dev) API to the LAN.
      - "127.0.0.1:8000:8000"
    depends_on:
      - qdrant
    extra_hosts:
      - "host.docker.internal:host-gateway"
    shm_size: "1g"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
      - playwright_browsers:/home/appuser/.cache/ms-playwright
    # A Docker recreate used to discard the manually downloaded Chromium
    # binary and made Instagram saves fail. Populate the named volume once,
    # then launch the API as the same non-root user that runs the scraper.
    command: >
      sh -c 'if ! find "$${PLAYWRIGHT_BROWSERS_PATH}" -maxdepth 1 -type d -name "chromium-*" -print -quit | grep -q .; then playwright install chromium; fi;
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload'

  frontend:
    build: ./frontend
    container_name: mindmesh-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      # NEXT_PUBLIC_SUPABASE_* come from frontend/.env.local and
      # frontend/.env.development so the browser and the backend always share
      # the same Supabase project and anon key.
      # Next's file watcher misses change events on the Docker Desktop bind
      # mount; poll instead so edits are recompiled during development.
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mindmesh-qdrant
    ports:
      # Loopback-only: the backend reaches Qdrant as http://qdrant:6333 on the
      # internal network; publishing on 0.0.0.0 would expose the whole
      # knowledge base without authentication.
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
    driver: local
  backend_data:
    driver: local
  playwright_browsers:
    driver: local
