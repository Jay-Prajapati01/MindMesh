stages:
  - lint
  - test
  - audit
  - build

backend-lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff
  script:
    - ruff check backend/app backend/tests
  rules:
    - changes:
        - backend/**/*

frontend-lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run lint
  rules:
    - changes:
        - frontend/**/*

frontend-typecheck:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npx tsc --noEmit
  rules:
    - changes:
        - frontend/**/*

# Secret detection over the full history (audit P0-1). Fails the pipeline
# when a credential-shaped string is found in any commit.
secret-scan:
  stage: lint
  image: zricethezav/gitleaks:latest
  variables:
    GITLEAKS_VERSION: "latest"
  script:
    - gitleaks detect --source . --redact --no-banner --exit-code 1
  allow_failure: false
  rules:
    - changes:
        - "**/*"

backend-test:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg tesseract-ocr build-essential liblxml2-dev libxslt1-dev
    - pip install -r backend/requirements.txt
  script:
    - cd backend && python -m pytest -q
  rules:
    - changes:
        - backend/**/*

# Dependency vulnerability audits
backend-audit:
  stage: audit
  image: python:3.11-slim
  before_script:
    - pip install pip-audit
  script:
    - pip-audit -r backend/requirements.txt
  allow_failure: true
  rules:
    - changes:
        - backend/requirements.txt
        - backend/Dockerfile

frontend-audit:
  stage: audit
  image: node:20-alpine
  script:
    - cd frontend && npm install && npm audit --audit-level=high
  allow_failure: true
  rules:
    - changes:
        - frontend/package.json
        - frontend/package-lock.json

backend-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t mindmesh-backend ./backend
  rules:
    - changes:
        - backend/**/*

# Production frontend image runs `next build` — this is the real compile
# gate (the dev Dockerfile only runs the dev server).
frontend-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -f frontend/Dockerfile.prod -t mindmesh-frontend ./frontend
  rules:
    - changes:
        - frontend/**/*
