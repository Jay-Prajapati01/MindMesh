stages:
  - lint
  - test
  - build

backend-lint:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install ruff
  script:
    - ruff check backend/app
  rules:
    - changes:
        - backend/**/*

frontend-lint:
  stage: lint
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run lint
  rules:
    - changes:
        - frontend/**/*

backend-test:
  stage: test
  image: python:3.11-slim
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends ffmpeg tesseract-ocr build-essential liblxml2-dev libxslt1-dev
    - pip install -r backend/requirements.txt
  script:
    - cd backend && python -m pytest -q
  rules:
    - changes:
        - backend/**/*

backend-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  script:
    - docker build -t mindmesh-backend ./backend
  rules:
    - changes:
        - backend/**/*
