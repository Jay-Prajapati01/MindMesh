# Standalone cloud API/frontend deployment. Do not merge with local compose.
services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.cloud
    env_file: .env.modal
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_EXECUTION_MODE: modal
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set the public HTTPS API URL}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the Supabase URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?Set the public anon key}
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
