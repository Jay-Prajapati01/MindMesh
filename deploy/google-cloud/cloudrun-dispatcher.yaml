# Cloud Run service: mindmesh-dispatcher (PRIVATE Cloud Tasks target).
# Same image as the API, different entrypoint. Ingress is internal-only and
# authentication is required: only the Cloud Tasks service account (with
# run.invoker) can reach /dispatch. Defense in depth: every task must also
# carry the X-Dispatch-Secret header checked by app/dispatcher.py.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: mindmesh-dispatcher
  annotations:
    run.googleapis.com/ingress: internal
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: mindmesh-dispatcher@YOUR-PROJECT-ID.iam.gserviceaccount.com
      containers:
        - image: YOUR-REGION-docker.pkg.dev/YOUR-PROJECT-ID/mindmesh-containers/mindmesh-api:LATEST
          command: ["uvicorn", "app.dispatcher:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: MINDMESH_EXECUTION_MODE
              value: cloud
            - name: JOB_BACKEND
              value: gcp
            - name: EMBEDDING_PROVIDER
              value: gemini
            - name: EMBEDDING_MODEL
              value: gemini-embedding-2
            - name: EMBEDDING_DIM
              value: "768"
            - name: QDRANT_COLLECTION
              value: mindmesh_gemini_v1
            - name: SUPABASE_URL
              value: https://YOUR-PROJECT.supabase.co
            - name: SUPABASE_DB_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-db-url
                  key: latest
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-service-role-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: CLOUD_TASKS_DISPATCH_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloud-tasks-dispatch-secret
                  key: latest
            - name: GCP_PROJECT_ID
              value: YOUR-PROJECT-ID
            - name: GCP_REGION
              value: YOUR-REGION
            - name: CLOUD_RUN_JOB_NAME
              value: mindmesh-worker
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
  traffic:
    - percent: 100
      latestRevision: true
