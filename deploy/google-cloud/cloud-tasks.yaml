# Cloud Tasks queue: mindmesh-jobs.
# Queues are created with gcloud (no declarative YAML apply); these are the
# exact commands. Bounded retries: a dispatch that keeps failing (bad job id,
# dead dispatcher) lands backoff-capped instead of looping forever.
#
# gcloud tasks queues create mindmesh-jobs \
#   --location=YOUR-REGION \
#   --max-dispatches-per-second=5 \
#   --max-concurrent-dispatches=3 \
#   --max-attempts=10 \
#   --min-backoff=30s \
#   --max-backoff=3600s \
#   --max-retry-duration=24h
#
# The API enqueues OIDC-authenticated tasks targeting the private dispatcher:
#   url:  https://mindmesh-dispatcher-XXXX-YOUR-REGION.run.app/dispatch/{job_id}
#   oidc: mindmesh-tasks@YOUR-PROJECT-ID.iam.gserviceaccount.com
#   header: X-Dispatch-Secret: <cloud-tasks-dispatch-secret>
#
# Required IAM (principle of least privilege):
#   mindmesh-tasks@...       -> roles/run.invoker on mindmesh-dispatcher
#   mindmesh-dispatcher@...   -> roles/run.developer on mindmesh-worker job
#   mindmesh-api@...          -> roles/cloudtasks.enqueuer on mindmesh-jobs
#                              + Secret Manager accessor on its own secrets
#   mindmesh-worker@...       -> Secret Manager accessor on its own secrets
#
# gcloud run services add-iam-policy-binding mindmesh-dispatcher \
#   --region=YOUR-REGION --member=serviceAccount:mindmesh-tasks@YOUR-PROJECT-ID.iam.gserviceaccount.com \
#   --role=roles/run.invoker
