# Production Docker Compose for Google Cloud
# Usage: docker compose -f deploy/docker-compose.prod.yml up -d --build
# Prerequisites:
#   - Copy deploy/.env.production.example to deploy/.env.production and fill in values
#   - Ensure DNS A record points to this VM's external IP
#   - Run: docker compose -f deploy/docker-compose.prod.yml up -d --build

services:
  caddy:
    image: caddy:2-alpine
    container_name: mindmesh-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:2019/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mindmesh-backend-prod
    env_file:
      - .env.production
    # No external ports - Caddy proxies to backend:8000
    expose:
      - "8000"
    depends_on:
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    shm_size: "1g"
    volumes:
      - backend_data:/app/data
      - uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
    container_name: mindmesh-frontend-prod
    env_file:
      - .env.production
    # No external ports - Caddy proxies to frontend:3000
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  qdrant:
    image: qdrant/qdrant:latest
    container_name: mindmesh-qdrant-prod
    # No external ports - internal network only
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  ollama:
    image: ollama/ollama:latest
    container_name: mindmesh-ollama-prod
    # No external ports - internal network only
    expose:
      - "11434"
    volumes:
      - ollama_storage:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
        reservations:
          cpus: "2"
          memory: 4G

volumes:
  qdrant_storage:
    driver: local
  ollama_storage:
    driver: local
  backend_data:
    driver: local
  uploads:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local